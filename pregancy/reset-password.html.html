<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Pregnancy Wiki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="reset-password" class="bg-rose-50/50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b border-rose-100 px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-rose-500 text-white font-bold shadow-sm">PW</span>
      <div>
        <span class="font-bold text-slate-900 block leading-tight">Pregnancy Wiki</span>
        <span class="text-xs text-slate-500">Maternal Health Portal</span>
      </div>
    </a>
    <a href="login.html" class="text-sm font-semibold text-rose-600 hover:text-rose-700">&larr; Back to Log In</a>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 md:p-8">
    <div class="w-full max-w-md rounded-2xl bg-white border border-rose-100 shadow-md p-6 md:p-8">
      <div class="mb-5">
        <span class="text-xs font-semibold uppercase tracking-wider text-rose-500">Account Recovery</span>
        <h1 class="text-2xl font-bold text-slate-900 mt-1">Reset Password</h1>
        <p class="text-xs text-slate-500 mt-1">Verify your registered username and phone number to set a new password.</p>
      </div>

      <div id="auth-alert" class="hidden mb-5 rounded-xl p-3.5 text-xs font-medium"></div>

      <form id="reset-form" class="space-y-4">
        <div>
          <label for="reset-username" class="block text-xs font-semibold text-slate-700 mb-1">Registered Username</label>
          <input type="text" id="reset-username" required placeholder="Enter your username" class="w-full rounded-xl border-slate-200 text-sm focus:border-rose-500 focus:ring-rose-500" />
        </div>

        <div>
          <label for="reset-phone" class="block text-xs font-semibold text-slate-700 mb-1">Registered Phone Number</label>
          <input type="tel" id="reset-phone" required placeholder="Enter your registered phone number" class="w-full rounded-xl border-slate-200 text-sm focus:border-rose-500 focus:ring-rose-500" />
        </div>

        <div>
          <label for="reset-new-password" class="block text-xs font-semibold text-slate-700 mb-1">New Password</label>
          <input type="password" id="reset-new-password" required minlength="6" placeholder="Enter new password (min 6 chars)" class="w-full rounded-xl border-slate-200 text-sm focus:border-rose-500 focus:ring-rose-500" />
        </div>

        <div>
          <label for="reset-confirm-password" class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password</label>
          <input type="password" id="reset-confirm-password" required minlength="6" placeholder="Confirm new password" class="w-full rounded-xl border-slate-200 text-sm focus:border-rose-500 focus:ring-rose-500" />
        </div>

        <button type="submit" class="w-full rounded-xl bg-rose-600 py-3 text-sm font-semibold text-white shadow-sm hover:bg-rose-700 transition">Reset Password</button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
        <span>Remembered your password?</span>
        <a href="login.html" class="font-bold text-rose-600 hover:underline">Log In &rarr;</a>
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">Pregnancy Wiki &bull; Maternal Health Community</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
