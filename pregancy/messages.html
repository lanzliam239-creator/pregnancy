<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - Pregnancy Wiki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="messages" class="bg-rose-50/40 text-slate-800 antialiased">

  <header class="md:hidden sticky top-0 z-30 flex items-center justify-between bg-white border-b border-rose-100 px-4 py-3 shadow-sm">
    <a href="index.html" class="flex items-center gap-2 font-bold text-rose-600 text-lg">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-rose-500 text-white">PW</span>
      Pregnancy Wiki
    </a>
    <button id="mobile-menu-btn" type="button" class="rounded-lg p-2 text-slate-600 hover:bg-rose-50">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <div class="flex min-h-screen">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full md:translate-x-0 md:static bg-white border-r border-rose-100 flex flex-col justify-between transition-transform duration-200">
      <div>
        <div class="p-6 border-b border-rose-100">
          <a href="index.html" class="flex items-center gap-3">
            <span class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-rose-500 text-white font-bold text-lg shadow-sm">PW</span>
            <div>
              <h1 class="font-bold text-slate-900 leading-tight">Pregnancy Wiki</h1>
              <p class="text-xs text-slate-500">Maternal Health Guide</p>
            </div>
          </a>
        </div>
        <nav class="p-4 space-y-1.5">
          <a href="index.html" data-nav="home" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition"><span>🏠</span> Wiki Home</a>
          <a href="news-feed.html" data-nav="news-feed" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition"><span>📰</span> News Feed</a>
          <a href="messages.html" data-nav="messages" class="nav-link flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition">
            <span class="flex items-center gap-3"><span>💬</span> Messages</span>
            <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-[11px] font-semibold text-emerald-700">Nurse Online</span>
          </a>
        </nav>
      </div>
      <div class="p-4 border-t border-rose-100 space-y-3">
        <button id="open-health-centers-btn" type="button" class="w-full flex items-center justify-center gap-2 rounded-xl bg-rose-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-rose-700 transition">
          <span>🏥</span> Local Health Centers
        </button>
      </div>
    </aside>

    <!-- Chat Interface -->
    <main class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full flex flex-col">
      <div class="flex-1 rounded-2xl bg-white border border-rose-100 shadow-sm flex flex-col overflow-hidden min-h-[78vh]">
        <!-- Default Healthcare Worker Header -->
        <div class="flex items-center justify-between border-b border-rose-100 bg-rose-50/60 px-6 py-4">
          <div class="flex items-center gap-3">
            <div class="relative">
              <div class="h-11 w-11 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm">CR</div>
              <span class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-white bg-emerald-500"></span>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h2 class="font-bold text-slate-900">Nurse Clarissa Reyes, RN</h2>
                <span class="rounded-full bg-emerald-100 px-2.5 py-0.5 text-[11px] font-semibold text-emerald-700">Verified Healthcare Worker</span>
              </div>
              <p class="text-xs text-slate-500">Default Consultation Contact &bull; Instant Reply Enabled (No friend request needed)</p>
            </div>
          </div>
        </div>

        <!-- Messages Feed -->
        <div id="chat-messages" class="flex-1 p-6 space-y-4 overflow-y-auto bg-slate-50/40"></div>

        <!-- Quick Topic Prompts -->
        <div class="px-6 py-2 bg-white border-t border-slate-100 flex flex-wrap gap-2">
          <button type="button" class="quick-ask rounded-full bg-rose-50 px-3 py-1 text-xs font-medium text-rose-700 hover:bg-rose-100 transition">Prenatal checkup schedule?</button>
          <button type="button" class="quick-ask rounded-full bg-rose-50 px-3 py-1 text-xs font-medium text-rose-700 hover:bg-rose-100 transition">Morning sickness relief tips</button>
          <button type="button" class="quick-ask rounded-full bg-rose-50 px-3 py-1 text-xs font-medium text-rose-700 hover:bg-rose-100 transition">Nearest free health center</button>
        </div>

        <!-- Input Bar -->
        <form id="chat-form" class="border-t border-rose-100 bg-white p-4 flex gap-3">
          <input type="text" id="chat-input" required placeholder="Type your health question to Nurse Clarissa..." class="flex-1 rounded-xl border-slate-200 text-sm focus:border-rose-500 focus:ring-rose-500" />
          <button type="submit" class="rounded-xl bg-rose-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-rose-700 transition">Send</button>
        </form>
      </div>
    </main>
  </div>

  <div id="health-centers-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-xs"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
